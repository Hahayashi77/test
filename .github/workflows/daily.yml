name: daily-brief

# 每天北京时间 07:13 生成一期；也可在 Actions 页面点 "Run workflow" 手动跑。
# 需要仓库 Secrets 里配置 DEEPSEEK_API_KEY（Settings → Secrets and variables → Actions）。

on:
  schedule:
    - cron: "13 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取不调模型（0 成本，用于排查信源）"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "brief/**"
      - "config.toml"
      - ".github/workflows/daily.yml"

permissions:
  contents: write        # 提交生成的 site/
  pages: write           # 发布 Pages
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      cost: ${{ steps.gen.outputs.cost }}
      lede: ${{ steps.gen.outputs.lede }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 零依赖项目，不需要缓存 pip

      - name: 生成日报
        id: gen
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m brief build --dry-run --force
          else
            # 先体检：模型名/端点/Key 不对时立刻报错，而不是连发 24 次失败请求
            python -m brief doctor --ask
            python -m brief build --offline --force --github-output "$GITHUB_OUTPUT"
          fi

      - name: 校验生成物（防止坏文件进入 Pages）
        run: |
          set -euo pipefail
          # 生成目录里绝不允许出现 Git 冲突标记。曾因 rebase 冲突残留 <<<<<<< HEAD
          # 被当成"成功产物"发布到 Pages，导致线上 JSON 全部损坏。
          if grep -rIl -E '^(<{7}|={7}|>{7})( |$)' site/ ; then
            echo "::error::生成物里出现 Git 冲突标记，拒绝发布"
            exit 1
          fi
          python -m brief verify site ${{ inputs.dry_run == true && '--allow-degraded' || '' }}

      - name: 提交结果
        run: |
          set -euo pipefail
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add site/
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 日报 $(date -u +%Y-%m-%d)"

          # 并发运行会撞车。但 site/ 是纯生成物，rebase 必冲突（每次内容都不同），
          # 所以冲突时用"我们的版本"重建这次提交，而不是让 rebase 留下冲突标记。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒（第 $i 次），拉取远端后重试…"
            git fetch origin main
            # --abort 保证不会留下半完成的 rebase 状态
            git rebase --abort 2>/dev/null || true
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              # 生成物冲突：以本次生成的内容为准，重新提交在远端最新之上
              git reset --soft origin/main
              git add site/
              git commit -m "chore: 日报 $(date -u +%Y-%m-%d)"
            fi
            sleep $((i * 3))
          done
          # 提交失败不能让整次运行变绿：产物已在 Pages 上，但仓库没同步，需要人看见
          echo "::error::连续 5 次推送失败，仓库未同步（站点已发布）"
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 运行摘要
        env:
          LEDE: ${{ needs.build.outputs.lede }}
          COST: ${{ needs.build.outputs.cost }}
        run: |
          {
            echo "### 今日简报"
            echo ""
            echo "${LEDE:-（导语为空，可能是降级运行）}"
            echo ""
            echo "本次模型花费：\$${COST:-0}"
            echo ""
            echo "站点：https://\${{ github.repository_owner }}.github.io/\${{ github.event.repository.name }}/"
          } >> "$GITHUB_STEP_SUMMARY"