# ─────────────────────────────────────────────────────────────
# 每日技术简报 · 配置
# 改这个文件就能换信源、调话题权重、控成本，不用动代码。
# ─────────────────────────────────────────────────────────────

[site]
title = "每日技术简报"
tagline = "AI · 开源 · 工程 —— 每天 5 分钟读完"
# 部署到 GitHub Pages 时的仓库名，用于生成绝对链接（RSS / 分享）
base_url = "https://hahayashi77.github.io/test"
language = "zh-CN"

[model]
provider = "yyapi"                        # 中转站；官方就写 deepseek
base_url = "https://www.yyapi.cloud/v1"   # 注意：中转站地址通常带 /v1
model = "deepseek-v4.1-flash"             # 已核对：该中转站可用（另有 deepseek-v4-pro）
temperature = 0.3
# 每次请求塞多少条给模型（条目多→分批，避免单次超长）
batch_size = 8
# 单次输出上限
max_output_tokens = 3000
# 摘录截断长度：越大越贵但信息越全
excerpt_chars = 420

# OpenAI 兼容端点通用旋钮（中转站经常不支持 json 模式）
json_mode = "auto"          # auto=先试，400 就自动关掉 | on | off

# 计价：真实花费 = 官方价 × price_multiplier × usd_per_unit
# 官方 DeepSeek 保持 1.0 / 1.0 即可；中转站按你自己的充值比例填。
# 例：官方价 0.5x、充值 1 元 = 1 美元（汇率约 7）→ 0.5 和 0.14
price_multiplier = 1.0
usd_per_unit = 1.0

# GitHub Actions 里取的 Secret 名
api_key_env = "DEEPSEEK_API_KEY"

[budget]
# 单次运行的成本上限（美元）。超出后停止调用模型，用降级模式出报。
max_usd_per_run = 0.12
# 超预算时是否仍然生成（降级为“只列标题”）
fallback_on_budget = true

[select]
# 每期收录条数
total_items = 24
# 单个信源最多几条（保证多样性，别被 HN 刷屏）
max_per_source = 6
# 更早于 N 小时的条目开始降权
recency_hours = 18
# 标题短于这个字数直接丢（大多是残缺条目）
min_title_chars = 6
# 过滤会议报名、招聘、促销类噪音
drop_promo = true
# 摘要太短的条目（如 HN 只有标题），最多补抓多少个原文页的 meta description
enrich_max = 10

# 话题关键词加权：命中即加分（小写匹配）
[select.keywords]
"ai" = 1.2
"llm" = 1.2
"agent" = 1.0
"deepseek" = 1.5
"claude" = 0.8
"gpt" = 0.8
"open source" = 0.8
"开源" = 0.8
"模型" = 0.6
"推理" = 0.6
"rag" = 0.7
"inference" = 0.6
"rust" = 0.5
"compiler" = 0.4
"database" = 0.4
"security" = 0.4
"cve" = 0.3
"performance" = 0.3
"benchmark" = 0.2

# 话题降权：命中即减分（去掉不想看的）
[select.negative_keywords]
"crypto" = 1.0
"web3" = 1.0
"nft" = 1.5
"airdrop" = 1.5
"giveaway" = 1.0
"sponsored" = 2.0
"hiring" = 1.0
"招聘" = 1.0

# ── 信源 ──────────────────────────────────────────────────────
# kind:   rss | atom | arxiv
# weight: 综合权重（1.0 为基准，>1 更容易入选）
# limit:  最多拉多少条候选（进排序池，不是最终展示数）
# order:  板块排序，小的排前面
# enabled: 想临时关掉某个源，改成 false 即可

[[sources]]
id = "hn"
kind = "rss"
url = "https://hnrss.org/frontpage?points=120"
category = "社区热议"
weight = 1.3
limit = 30
min_points = 120
order = 10

[[sources]]
id = "github-trending"
kind = "rss"
url = "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
category = "开源趋势"
weight = 1.2
limit = 25
order = 20

[[sources]]
id = "arxiv"
kind = "arxiv"
url = "https://export.arxiv.org/api/query"
category = "论文速递"
weight = 1.1
limit = 20
cats = "cs.AI,cs.CL,cs.LG,cs.SE"
order = 30

[[sources]]
id = "hf-blog"
kind = "atom"
url = "https://huggingface.co/blog/feed.xml"
category = "行业动态"
weight = 1.0
limit = 12
order = 40

[[sources]]
id = "simonwillison"
kind = "atom"
url = "https://simonwillison.net/atom/everything/"
category = "行业动态"
weight = 1.0
limit = 12
order = 41

[[sources]]
id = "qbitai"
kind = "rss"
url = "https://www.qbitai.com/feed"
category = "中文圈"
weight = 0.9
limit = 12
order = 50

[[sources]]
